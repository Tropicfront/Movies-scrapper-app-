<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calendrier des sorties</title>
<style>
  :root {
    --bg: {{ '#ffffff' if theme == 'light' else '#0f1115' }};
    --card-bg: {{ '#f4f5f7' if theme == 'light' else '#1a1d24' }};
    --card-border: {{ '#e2e4e9' if theme == 'light' else '#2a2e38' }};
    --text: {{ '#16181d' if theme == 'light' else '#e8e8ec' }};
    --text-dim: {{ '#6b7280' if theme == 'light' else '#9096a3' }};
    --accent: #e8b64c;
    --accent-2: #4c9be8;
    --today-bg: {{ '#fff6e0' if theme == 'light' else '#2a2410' }};
    --modal-bg: {{ '#ffffff' if theme == 'light' else '#14171d' }};
    --weekend: {{ '#d94f4f' if theme == 'light' else '#e05252' }};
    --backdrop: {{ 'rgba(255,255,255,0.75)' if theme == 'light' else 'rgba(0,0,0,0.72)' }};
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  /* La grille s'étire pour remplir la hauteur de la tuile : plus de vide
     en bas, et pas de débordement sur les mois qui comptent 6 semaines
     (les lignes se partagent simplement la place disponible). */
  body {
    padding: 10px;
    display: flex;
    flex-direction: column;
  }
  .empty {
    color: var(--text-dim);
    font-size: 0.85rem;
    text-align: center;
    padding: 24px 0;
  }

  /* ---------- En-tête + navigation entre les mois ---------- */
  .cal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 10px;
  }
  .month-title {
    font-size: 1.05rem;
    font-weight: 700;
    text-transform: capitalize;
    text-align: center;
    flex: 1;
  }
  .nav-btn {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    color: var(--text);
    border-radius: 7px;
    width: 32px;
    height: 32px;
    flex-shrink: 0;
    cursor: pointer;
    font-size: 1.15rem;
    line-height: 1;
  }
  .nav-btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  .nav-btn:disabled { opacity: 0.3; cursor: default; }

  /* ---------- Grille du mois ---------- */
  .weekdays, .week {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 2px;
  }
  .weekdays { margin-bottom: 8px; }
  .weekdays span {
    text-align: center;
    font-size: 0.72rem;
    font-weight: 600;
    text-transform: uppercase;
    color: var(--text-dim);
    letter-spacing: 0.03em;
  }
  .month { display: none; }
  .month.active {
    display: flex;
    flex-direction: column;
    flex: 1;
    min-height: 0;
  }
  .week {
    flex: 1;
    min-height: 0;
    margin-bottom: 2px;
  }
  /* Cases sans fond ni bordure : juste le numéro du jour, et un point
     sous les jours qui ont des sorties. Mise en page calquée sur le widget
     calendrier de Homarr (week-ends en rouge, mois voisins estompés). */
  .day-cell {
    min-height: 42px;
    padding: 6px 0;
    border-radius: 8px;
    /* Bordure transparente présente en permanence : le contour doré
       d'aujourd'hui ne décale donc pas la grille quand il apparaît. */
    border: 1.5px solid transparent;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 5px;
  }
  .day-cell .day-num {
    font-size: 1.05rem;
    font-weight: 500;
    line-height: 1;
    color: var(--text);
  }
  /* Samedi et dimanche */
  .week .day-cell:nth-child(6) .day-num,
  .week .day-cell:nth-child(7) .day-num { color: var(--weekend); }
  /* Jours qui débordent sur le mois précédent / suivant */
  .day-cell.out-month .day-num { color: var(--text-dim); opacity: 0.65; }
  .day-cell.today {
    border-color: var(--accent);
    background: var(--today-bg);
    box-shadow: 0 0 0 1px rgba(232, 182, 76, 0.25);
  }
  .day-cell.today .day-num { color: var(--accent); font-weight: 800; }
  /* Le week-end reste rouge, sauf si c'est aujourd'hui : le doré prime */
  .week .day-cell.today:nth-child(6) .day-num,
  .week .day-cell.today:nth-child(7) .day-num { color: var(--accent); }
  .day-cell.has-releases { cursor: pointer; }
  .day-cell.has-releases:hover { background: var(--card-bg); }
  /* Indicateur de sorties : un simple compteur neutre. Plus de pastille de
     couleur par format dans la grille (donc plus de légende à afficher en
     bas), ce qui laisse la place à des cases et des chiffres plus grands.
     Le format reste indiqué, en couleur, dans la fenêtre du jour. */
  .day-markers {
    display: flex;
    gap: 3px;
    align-items: center;
    justify-content: center;
    min-height: 6px;
  }
  .day-marker {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .day-marker.m-4k        { background: #9b59f6; }
  .day-marker.m-bluray    { background: #4c9be8; }
  .day-marker.m-dvd       { background: #e05252; }
  .day-marker.m-autre     { background: #7b8495; }
  /* Steelbook : pastille en anneau, pour la distinguer au premier coup
     d'œil des pastilles de format, qui sont pleines. */
  .day-marker.m-steelbook {
    background: transparent;
    border: 1.5px solid #3ddc97;
  }
  .modal-loading, .ev-empty {
    padding: 18px 12px;
    text-align: center;
    font-size: 0.8rem;
    color: var(--text-dim);
  }

  /* Pastille de format, conservée uniquement dans la fenêtre du jour
     (à côté du titre), plus dans la grille */
  .ev-title .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .ev-title .dot.cat-4k     { background: #9b59f6; }
  .ev-title .dot.cat-bluray { background: #4c9be8; }
  .ev-title .dot.cat-dvd    { background: #e85c5c; }
  .ev-title .dot.cat-autre  { background: #888; }

  /* ---------- Fenêtre des sorties du jour (clic sur une case) ---------- */
  .backdrop {
    position: fixed;
    inset: 0;
    z-index: 50;
    background: var(--backdrop);
    display: none;
    padding: 8px;
    overflow: auto;
  }
  .backdrop.open { display: block; }
  .modal {
    background: var(--modal-bg);
    border: 1px solid var(--card-border);
    border-radius: 10px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.45);
    max-width: 720px;
    margin: 0 auto;
    overflow: hidden;
  }
  .modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 10px 12px;
    border-bottom: 1px solid var(--card-border);
    position: sticky;
    top: 0;
    background: var(--modal-bg);
  }
  .modal-title {
    font-size: 0.9rem;
    font-weight: 700;
    text-transform: capitalize;
  }
  .modal-count {
    font-size: 0.72rem;
    font-weight: 600;
    color: var(--text-dim);
  }
  .modal-close {
    background: transparent;
    border: 1px solid var(--card-border);
    color: var(--text);
    border-radius: 6px;
    width: 26px;
    height: 26px;
    flex-shrink: 0;
    cursor: pointer;
    font-size: 1rem;
    line-height: 1;
  }
  .modal-close:hover { border-color: #e85c5c; color: #e85c5c; }
  .modal-body { padding: 6px 0; }

  .ev {
    display: flex;
    gap: 12px;
    padding: 10px 12px;
    border-bottom: 1px solid var(--card-border);
    border-left: 3px solid transparent;
  }
  .ev:last-child { border-bottom: none; }
  .ev[data-category="4k"]     { border-left-color: #9b59f6; }
  .ev[data-category="bluray"] { border-left-color: #4c9be8; }
  .ev[data-category="dvd"]    { border-left-color: #e85c5c; }
  .ev-poster {
    width: 62px;
    height: 92px;
    flex-shrink: 0;
    border-radius: 6px;
    overflow: hidden;
    background: {{ '#e6e8ec' if theme == 'light' else '#0a0c10' }};
    display: flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    font-size: 1.4rem;
    color: var(--text-dim);
    border: 1px solid var(--card-border);
  }
  .ev-poster img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .ev-info {
    display: flex;
    flex-direction: column;
    gap: 5px;
    min-width: 0;
    flex: 1;
  }
  .ev-title {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.88rem;
    font-weight: 700;
    color: var(--text);
    text-decoration: none;
    line-height: 1.3;
  }
  .ev-title:hover { color: var(--accent-2); text-decoration: underline; }
  .ev-title .dot { width: 8px; height: 8px; }
  .ev-details {
    font-size: 0.74rem;
    color: var(--text-dim);
    line-height: 1.35;
  }
  .ev-badges { display: flex; flex-wrap: wrap; gap: 5px; }
  .badge {
    font-size: 0.64rem;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 999px;
    white-space: nowrap;
  }
  .badge.cat-4k     { background: #3a2a5c; color: #c9a9ff; }
  .badge.cat-bluray { background: #1c3a5c; color: #9ecbff; }
  .badge.cat-dvd    { background: #3a1c1c; color: #ffb3b3; }
  .badge.cat-autre  { background: #2a2e38; color: #ccc; }
  .badge.steel      { background: #10352b; color: #6ee7b7; }
  .badge.src        { background: #263042; color: #8fb8e8; font-weight: 600; }
  .badge.jf         { background: #22331f; color: #a3d977; font-weight: 600; }
  .ev-buy { display: flex; gap: 6px; margin-top: 1px; }
  .buy-btn {
    font-size: 0.68rem;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 6px;
    text-decoration: none;
    line-height: 1.4;
  }
  .buy-amazon { background: #ff9900; color: #0a0c10; }
  .buy-fnac   { background: #ffd200; color: #0a0c10; }
  .buy-btn:hover { opacity: 0.85; }
</style>
</head>
<body>

{% if months %}
  <div class="cal-header">
    <button class="nav-btn" id="prev-btn" type="button" aria-label="Mois précédent">&lsaquo;</button>
    <span class="month-title" id="month-title"></span>
    <button class="nav-btn" id="next-btn" type="button" aria-label="Mois suivant">&rsaquo;</button>
  </div>

  <div class="weekdays">
    <span>Lu</span><span>Ma</span><span>Me</span><span>Je</span><span>Ve</span><span>Sa</span><span>Di</span>
  </div>

  {% for month in months %}
    <div class="month {{ 'active' if loop.index0 == active_index else '' }}"
         data-index="{{ loop.index0 }}" data-label="{{ month.label }}">
      {% for week in month.weeks %}
        <div class="week">
          {% for cell in week %}
            <div class="day-cell {{ '' if cell.in_month else 'out-month' }} {{ 'today' if cell.date_iso == today_iso else '' }} {{ 'has-releases' if cell.releases else '' }}"
                 data-date="{{ cell.date_iso }}"
                 data-label="{{ cell.label }}"
                 data-count="{{ cell.releases|length }}"
                 {% if cell.hint %}title="{{ cell.hint }}"{% endif %}>
              <span class="day-num">{{ cell.day_num }}</span>
              {% if cell.markers %}
                <div class="day-markers">
                  {% for marker in cell.markers %}<span class="day-marker m-{{ marker }}"></span>{% endfor %}
                </div>
              {% endif %}
            </div>
          {% endfor %}
        </div>
      {% endfor %}
    </div>
  {% endfor %}

  <div class="backdrop" id="backdrop">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-header">
        <div>
          <div class="modal-title" id="modal-title"></div>
          <div class="modal-count" id="modal-count"></div>
        </div>
        <button class="modal-close" id="modal-close" type="button" aria-label="Fermer">&times;</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>
{% else %}
  <p class="empty">Aucune sortie à afficher.</p>
{% endif %}

<script>
(function () {
  const months = Array.from(document.querySelectorAll('.month'));
  if (!months.length) return;

  const title = document.getElementById('month-title');
  const prevBtn = document.getElementById('prev-btn');
  const nextBtn = document.getElementById('next-btn');

  let current = months.findIndex(m => m.classList.contains('active'));
  if (current < 0) current = 0;

  function show(index) {
    current = Math.max(0, Math.min(months.length - 1, index));
    months.forEach((m, i) => m.classList.toggle('active', i === current));
    title.textContent = months[current].dataset.label || '';
    prevBtn.disabled = current === 0;
    nextBtn.disabled = current === months.length - 1;
  }

  prevBtn.addEventListener('click', () => show(current - 1));
  nextBtn.addEventListener('click', () => show(current + 1));
  show(current);

  // ---- Fenêtre des sorties d'un jour ----
  const backdrop = document.getElementById('backdrop');
  const modalTitle = document.getElementById('modal-title');
  const modalCount = document.getElementById('modal-count');
  const modalBody = document.getElementById('modal-body');

  // Filtres de la grille, rejoués sur la requête du détail d'un jour
  const dayQuery = {{ day_query|tojson }};
  const dayUrlTemplate = {{ url_for('widget_day', day_iso='__DAY__')|tojson }};
  let currentRequest = 0;

  async function openDay(cell) {
    const day = cell.dataset.date;
    if (!day) return;
    const count = parseInt(cell.dataset.count || '0', 10);
    modalTitle.textContent = cell.dataset.label || '';
    modalCount.textContent = count + (count > 1 ? ' sorties' : ' sortie');
    modalBody.innerHTML = '<p class="modal-loading">Chargement…</p>';
    backdrop.classList.add('open');
    backdrop.scrollTop = 0;

    // Le détail est chargé à la demande : la grille ne contient que les
    // dates et les compteurs, ce qui garde la page du widget légère.
    const token = ++currentRequest;
    try {
      // Chemin construit par Flask (url_for) plutôt qu'une URL relative :
      // reste correct derrière un reverse proxy monté sur un sous-chemin.
      const url = dayUrlTemplate.replace('__DAY__', encodeURIComponent(day))
                  + (dayQuery ? '?' + dayQuery : '');
      const res = await fetch(url, { headers: { 'Accept': 'text/html' } });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const html = await res.text();
      if (token !== currentRequest) return;  // une autre case a été cliquée
      modalBody.innerHTML = html;
    } catch (err) {
      if (token !== currentRequest) return;
      modalBody.innerHTML = '<p class="modal-loading">Impossible de charger les sorties de ce jour.</p>';
    }
  }

  function closeDay() {
    backdrop.classList.remove('open');
    modalBody.innerHTML = '';
  }

  document.querySelectorAll('.day-cell.has-releases').forEach(cell => {
    cell.addEventListener('click', () => openDay(cell));
  });

  document.getElementById('modal-close').addEventListener('click', closeDay);
  backdrop.addEventListener('click', (e) => { if (e.target === backdrop) closeDay(); });
  document.addEventListener('keydown', (e) => {
    const modalOpen = backdrop.classList.contains('open');
    if (e.key === 'Escape') closeDay();
    else if (modalOpen) return;  // les flèches ne changent pas de mois derrière la fenêtre
    else if (e.key === 'ArrowLeft') show(current - 1);
    else if (e.key === 'ArrowRight') show(current + 1);
  });
})();
</script>
</body>
</html>
