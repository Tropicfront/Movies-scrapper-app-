<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sorties</title>
<style>
  :root {
    --bg: {{ '#ffffff' if theme == 'light' else '#0f1115' }};
    --card-bg: {{ '#f4f5f7' if theme == 'light' else '#1a1d24' }};
    --card-border: {{ '#e2e4e9' if theme == 'light' else '#2a2e38' }};
    --text: {{ '#16181d' if theme == 'light' else '#e8e8ec' }};
    --text-dim: {{ '#6b7280' if theme == 'light' else '#9096a3' }};
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  body {
    padding: 8px;
    overflow-y: auto;
  }
  .empty {
    color: var(--text-dim);
    font-size: 0.85rem;
    text-align: center;
    padding: 24px 0;
  }
  .list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .item {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 8px;
    padding: 8px 10px;
  }
  .poster {
    width: 38px;
    height: 54px;
    border-radius: 5px;
    object-fit: cover;
    flex-shrink: 0;
    background: rgba(128,128,128,0.15);
  }
  .poster-placeholder {
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.1rem;
  }
  .info {
    min-width: 0;
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .date {
    font-size: 0.68rem;
    color: var(--text-dim);
  }
  .title-row {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .title {
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--text);
    text-decoration: none;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .tmdb-btn {
    flex-shrink: 0;
    background: #01b4e4;
    color: #04152b;
    font-weight: 800;
    font-size: 0.6rem;
    letter-spacing: 0.02em;
    padding: 2px 5px;
    border-radius: 4px;
    text-decoration: none;
    line-height: 1.3;
  }
  .format {
    font-size: 0.62rem;
    color: var(--text-dim);
  }
</style>
</head>
<body>
  {% if releases %}
    <div class="list">
      {% for r in releases %}
        <div class="item">
          {% if r.poster_url %}
            <img class="poster" src="{{ r.poster_url }}" loading="lazy" alt="">
          {% else %}
            <span class="poster poster-placeholder" aria-hidden="true">🎬</span>
          {% endif %}
          <div class="info">
            <span class="date">{{ r.date_text }}</span>
            <div class="title-row">
              {% if r.poster_page_url %}
                <a href="{{ r.poster_page_url }}" target="_blank" rel="noopener" class="tmdb-btn">TMDB</a>
              {% endif %}
              <a href="{{ r.url }}" target="_blank" rel="noopener" class="title">{{ r.title }}</a>
            </div>
            <span class="format">{{ r.details }}</span>
          </div>
        </div>
      {% endfor %}
    </div>
  {% else %}
    <p class="empty">Aucune sortie à afficher.</p>
  {% endif %}
</body>
</html>
